[project]
name = "kassi-graph"
version = "0.1.0"
description = "Reachability analysis for source→sink paths with sanitizer gates. Pluggable across kassi-* tools."
authors = [{ name = "vtoptunov" }]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
kassi-graph = "kassi_graph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kassi_graph"]

[tool.hatch.build.targets.wheel.force-include]
"src/kassi_graph/adapters/django.yaml" = "kassi_graph/adapters/django.yaml"
"src/kassi_graph/adapters/zulip.yaml" = "kassi_graph/adapters/zulip.yaml"
